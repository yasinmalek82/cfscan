[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfscan"
version = "1.3.0"
description = "A friendly interactive wrapper around XIU2/CloudflareSpeedTest (cfst)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cloudflare", "cdn", "speedtest", "cfst", "networking"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
cfscan = "cfscan.cli:main"

[tool.setuptools]
packages = ["cfscan"]
